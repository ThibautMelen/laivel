# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# laivel · AIDD level judge · Nika only
#
# infer extracts cited facts (OpenAI). jq applies the official law
# (all axes or nothing). nika:decide says whether the verdict is
# publishable (recommend) or must stay uncertain (defer / human_required).
# infer then narrates the next step. It cannot change the level.
# nika:chart draws the team. nika:hash + nika:validate seal the roster.
# nika:date / nika:uuid stamp the receipt. Zero helper scripts.
#
# Run ·
#   nika run laivel.nika.yaml
#   nika run laivel.nika.yaml --var profiles=./profiles/*.md --max-cost-usd 3
#   nika run laivel.nika.yaml --var self_test=true --max-cost-usd 3
#   nika run laivel.nika.yaml --model mock/echo   # zero-key rehearsal

nika: laivel-assess

model: openai/gpt-5-mini

run:
  clock: system
  entropy: ambient

inputs:
  profiles:
    type: string
    required: false
    default: "./fixtures/*.md"
    description: "Glob of developer profile markdown files"
  model:
    type: string
    required: false
    default: "openai/gpt-5-mini"
    description: "provider/name · openai/gpt-5-mini or openai/gpt-5.2"
  self_test:
    type: bool
    required: false
    default: false
    description: "When true, assert scored levels against expected.json"
  expected:
    type: string
    required: false
    default: "./fixtures/expected.json"
    description: "Map of stem -> expected level, used only when self_test is true"

const:
  bundle: "./decisions/aidd-publish.bundle.json"
  rubric: "./levels/aidd.yaml"
  team_schema: "./decisions/team.schema.json"

permits:
  exec: false
  tools:
    - "nika:glob"
    - "nika:read"
    - "nika:jq"
    - "nika:write"
    - "nika:decide"
    - "nika:assert"
    - "nika:chart"
    - "nika:log"
    - "nika:date"
    - "nika:uuid"
    - "nika:hash"
    - "nika:validate"
    - "nika:convert"
    - "nika:emit"
    - "nika:json_diff"
  fs:
    read:
      - "./fixtures/**"
      - "./held/**"
      - "./profiles/**"
      - "./levels/**"
      - "./decisions/**"
    write:
      - "./out/**"

tasks:
  now:
    invoke:
      tool: "nika:date"
      args:
        op: now
        tz: UTC

  run_id:
    invoke:
      tool: "nika:uuid"
      args:
        version: v7

  hello:
    with:
      id: ${{ tasks.run_id.output }}
      t: ${{ tasks.now.output }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "laivel · ${{ with.id }} · ${{ with.t }} · extract · jq law · decide"

  files:
    invoke:
      tool: "nika:glob"
      args:
        pattern: "${{ inputs.profiles }}"
    lift:
      - law: taint
        from: inputs.profiles
        because: "operator glob, still gated by the literal permits.fs.read tree"

  rubric:
    invoke:
      tool: "nika:read"
      args:
        path: "${{ const.rubric }}"

  texts:
    with:
      paths: ${{ tasks.files.output }}
    for_each:
      items: ${{ with.paths }}
      max_parallel: 8
      fail_fast: false
    on_error:
      recover: null
    invoke:
      tool: "nika:read"
      args:
        path: "${{ item }}"

  pairs:
    with:
      paths: ${{ tasks.files.output }}
      texts: ${{ tasks.texts.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.paths }}", "${{ with.texts }}"]
        expression: >-
          transpose
          | map(select(.[1] != null))
          | map({
              path: .[0],
              text: .[1],
              stem: (.[0] | split("/") | last | rtrimstr(".md"))
            })
          | map(select(.stem != "README" and .stem != "expected"))

  signals:
    with:
      pairs: ${{ tasks.pairs.output }}
      model: ${{ inputs.model }}
      rubric: ${{ tasks.rubric.output }}
    timeout: "90s"
    for_each:
      items: ${{ with.pairs }}
      max_parallel: 2
      fail_fast: false
    on_error:
      recover: null
    retry:
      max_attempts: 4
      backoff_strategy: exponential
      jitter: true
    infer:
      model: "${{ inputs.model }}"
      max_tokens: 2500
      prompt: |
        Extraire des FAITS AIDD. Ne PAS attribuer de niveau.

        Grille (loi: tous les axes ou rien) ·
        ${{ with.rubric }}

        Axes:
        taille: none | S | M | L | XL
        harness: none | prompts | context | context_behavior | context_behavior_loops
        intervention: none | after_majority | after_part | key_steps | never
        parallele: -1 (inconnu) | 0 | 1 | 3
        autonomy: no | human_starts | agents_pick
        throughput: none | one | multi_pr_day

        Traduction (recit -> enum), ne pas inventer:
        - aucune IA, jamais ouvert un chat → harness none
        - colle ChatGPT / un prompt, recolle dans l'IDE, pas de fichier de contexte → harness prompts (PAS none)
        - memoire projet / AGENTS.md, pas d'agents versionnes → harness context
        - rules+agents versionnes, pas de boucle CI → harness context_behavior
        - hook qui relance tant que la CI est rouge → harness context_behavior_loops
        - prompts colles, petit endpoint, commits correctifs, relit tout → S / prompts / after_majority / 1
        - memoire projet, feature d'un module, relit une partie → M / context / after_part / 1
        - rules+agents, feature multi-etapes, cadrage/revue seulement → L / context_behavior / key_steps / 1
        - un seul chantier, jamais deux, un ticket a la fois → parallele 1
        - zero PR, n'a pas commence → parallele 0
        - 3 chantiers le meme jour jusqu'a la PR → parallele 3
        - il lance encore chaque boucle le matin → autonomy human_starts
        - les agents prennent les tickets, plusieurs PR par jour → agents_pick / multi_pr_day
        - tous les commits sont les siens apres coup → pas never
        - zero commit humain + ne rouvre plus le diff + hook CI → intervention never
          (lancer la boucle le matin = autonomy human_starts, pas une intervention)
        - il dit que l'IA a tout genere ET aucun AGENTS.md → conflict true, harness none

        Sans preuve: unknown (parallele -1) et l'axe dans missing.
        Deux faits incompatibles: conflict true, unknown sur les axes qui se battent.

        Fichier · ${{ item.stem }}
        Profil ·
        ${{ item.text }}
      schema:
        type: object
        additionalProperties: false
        required:
          - taille
          - harness
          - intervention
          - parallele
          - autonomy
          - throughput
          - missing
          - conflict
        properties:
          taille:
            type: string
            enum: [unknown, none, S, M, L, XL]
          harness:
            type: string
            enum: [unknown, none, prompts, context, context_behavior, context_behavior_loops]
          intervention:
            type: string
            enum: [unknown, none, after_majority, after_part, key_steps, never]
          parallele:
            type: integer
            enum: [-1, 0, 1, 3]
          autonomy:
            type: string
            enum: [unknown, no, human_starts, agents_pick]
          throughput:
            type: string
            enum: [unknown, none, one, multi_pr_day]
          missing:
            type: array
            items: { type: string }
          conflict:
            type: boolean
          evidence:
            type: object
            additionalProperties: false
            properties:
              taille: { type: array, items: { type: string } }
              harness: { type: array, items: { type: string } }
              intervention: { type: array, items: { type: string } }
              parallele: { type: array, items: { type: string } }

  retry_need:
    with:
      pairs: ${{ tasks.pairs.output }}
      extracted: ${{ tasks.signals.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.pairs }}", "${{ with.extracted }}"]
        expression: >-
          transpose
          | map(select(.[1] == null) | .[0])

  retry_signals:
    with:
      need: ${{ tasks.retry_need.output }}
      model: ${{ inputs.model }}
    timeout: "90s"
    for_each:
      items: ${{ with.need }}
      max_parallel: 2
      fail_fast: false
    on_error:
      recover: null
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      jitter: true
    infer:
      model: "${{ inputs.model }}"
      max_tokens: 1200
      prompt: |
        Extraire uniquement les faits AIDD. Pas de niveau.
        taille: none|S|M|L|XL|unknown
        harness: none|prompts|context|context_behavior|context_behavior_loops|unknown
        intervention: none|after_majority|after_part|key_steps|never|unknown
        parallele: -1|0|1|3 (-1 = inconnu · un seul chantier = 1, pas 0)
        autonomy: no|human_starts|agents_pick|unknown
        throughput: none|one|multi_pr_day|unknown
        Deux faits incompatibles: conflict true. Commits humains + never = conflict.
        Fichier · ${{ item.stem }}
        ${{ item.text }}
      schema:
        type: object
        additionalProperties: false
        required:
          - taille
          - harness
          - intervention
          - parallele
        properties:
          taille:
            type: string
            enum: [unknown, none, S, M, L, XL]
          harness:
            type: string
            enum: [unknown, none, prompts, context, context_behavior, context_behavior_loops]
          intervention:
            type: string
            enum: [unknown, none, after_majority, after_part, key_steps, never]
          parallele:
            type: string
            enum: ["-1", "0", "1", "3", unknown]
          autonomy:
            type: string
            enum: [unknown, no, human_starts, agents_pick]
          throughput:
            type: string
            enum: [unknown, none, one, multi_pr_day]
          missing:
            type: array
            items: { type: string }
          conflict:
            type: boolean

  signals_merged:
    with:
      pairs: ${{ tasks.pairs.output }}
      first: ${{ tasks.signals.output }}
      need: ${{ tasks.retry_need.output }}
      retry: ${{ tasks.retry_signals.output }}
    invoke:
      tool: "nika:jq"
      args:
        input:
          - "${{ with.pairs }}"
          - "${{ with.first }}"
          - "${{ with.need }}"
          - "${{ with.retry }}"
        expression: >-
          .[0] as $pairs
          | .[1] as $first
          | (.[2] // []) as $need
          | (.[3] // []) as $retry
          | ($need | map(.stem)) as $stems
          | [range(0; ($pairs | length))]
          | map(
              . as $i
              | if $first[$i] != null then $first[$i]
                else
                  (($stems | index($pairs[$i].stem)) // -1) as $j
                  | if $j >= 0 then $retry[$j] else null end
                end
            )

  signals_filled:
    with:
      merged: ${{ tasks.signals_merged.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.merged }}"
        expression: >-
          def blank:
            {
              taille: "unknown", harness: "unknown", intervention: "unknown",
              parallele: -1, autonomy: "unknown", throughput: "unknown",
              missing: ["all"], conflict: false, fallback: true, evidence: {}
            };
          map(if . == null then blank else . + { fallback: false } end)

  extract_stats:
    with:
      first: ${{ tasks.signals.output }}
      merged: ${{ tasks.signals_merged.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.first }}", "${{ with.merged }}"]
        expression: >-
          ((.[0] // []) | map(select(. == null)) | length) as $miss
          | ((.[1] // []) | map(select(. == null)) | length) as $still
          | ((.[1] // []) | length) as $n
          | "extract " + ($n | tostring)
            + " · first-pass miss " + ($miss | tostring)
            + " · after retry " + ($still | tostring)

  log_extract:
    with:
      msg: ${{ tasks.extract_stats.output }}
    invoke:
      tool: "nika:log"
      args:
        level: info
        message: "${{ with.msg }}"

  scored:
    with:
      pairs: ${{ tasks.pairs.output }}
      extracted: ${{ tasks.signals_filled.output }}
      observed_at: ${{ tasks.now.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.pairs }}", "${{ with.extracted }}", "${{ with.observed_at }}"]
        expression: >-
          .[2] as $t
          | (.[0] // []) as $pairs
          | (.[1] // []) as $ex
          | def blank:
              {
                taille: "unknown", harness: "unknown", intervention: "unknown",
                parallele: "unknown", autonomy: "unknown", throughput: "unknown",
                missing: ["all"], conflict: false, evidence: {}
              };
            def para($v):
              if ($v == -1) or ($v == "-1") or ($v == "unknown") or ($v == null)
              then "unknown"
              elif ($v == 0) or ($v == "0") then "0"
              elif ($v == 1) or ($v == "1") then "1"
              elif ($v == 3) or ($v == "3") then "3"
              else "unknown" end;
            def norm($raw):
              (if $raw == null then blank else $raw end) as $s
              | $s + { parallele: para($s.parallele), conflict: ($s.conflict == true) };
            def correct($s; $text):
              ($text // "") as $t
              | ($s
                 | if (.harness == "none")
                      and ($t | test("ChatGPT|colle|recolle"; "i"))
                   then .harness = "prompts" else . end
                 | if (.harness == "context_behavior_loops")
                      and (.intervention != "never")
                      and ($t | test("ne rouvre plus|zero commit|aucun commit|pas de sa main"; "i"))
                   then .intervention = "never" else . end
                );
            def contra($s):
              ($s.conflict == true)
              or (
                (($s.taille == "L") or ($s.taille == "XL"))
                and ($s.harness == "none")
              )
              or (
                ($s.intervention == "never")
                and (($s.harness == "none") or ($s.harness == "prompts"))
              )
              or (
                ($s.parallele == "3")
                and (($s.taille == "none") or ($s.taille == "S"))
              )
              or (
                ($s.autonomy == "agents_pick")
                and ($s.harness != "context_behavior_loops")
              );
            def score($s):
              ({none:0,S:1,M:2,L:3,XL:3}[$s.taille]) as $rt
              | ({
                  none:0, prompts:1, context:2,
                  context_behavior:3, context_behavior_loops:4
                }[$s.harness]) as $rh
              | ({
                  none:0, after_majority:1, after_part:2,
                  key_steps:3, never:4
                }[$s.intervention]) as $ri
              | ({"0":0,"1":1,"3":2}[$s.parallele]) as $rp
              | (
                  if contra($s) then "white"
                  elif ($rt != null and $rt >= 3 and $rh != null and $rh >= 4
                      and $ri != null and $ri >= 4 and $rp != null and $rp >= 2
                      and $s.autonomy == "agents_pick"
                      and $s.throughput == "multi_pr_day")
                  then "gold"
                  elif ($rt != null and $rt >= 3 and $rh != null and $rh >= 4
                        and $ri != null and $ri >= 4 and $rp != null and $rp >= 2)
                  then "silver"
                  elif ($rt != null and $rt >= 3 and $rh != null and $rh >= 3
                        and $ri != null and $ri >= 3 and $rp != null and $rp >= 2)
                  then "copper"
                  elif ($rt != null and $rt >= 3 and $rh != null and $rh >= 3
                        and $ri != null and $ri >= 3 and $rp != null and $rp >= 1)
                  then "green"
                  elif ($rt != null and $rt >= 2 and $rh != null and $rh >= 2
                        and $ri != null and $ri >= 2 and $rp != null and $rp >= 1)
                  then "blue"
                  elif ($rt != null and $rt >= 1 and $rh != null and $rh >= 1
                        and $ri != null and $ri >= 1 and $rp != null and $rp >= 1)
                  then "red"
                  else "white"
                  end
                ) as $level
              | (
                  [$s.taille, $s.harness, $s.intervention, $s.parallele]
                  | map(select(. == null or . == "unknown"))
                  | length
                ) as $unk
              | {
                  level: $level,
                  rank: {
                    white:0, red:1, blue:2, green:3,
                    copper:4, silver:5, gold:6
                  }[$level],
                  next: {
                    white:"red", red:"blue", blue:"green",
                    green:"copper", copper:"silver", silver:"gold", gold:null
                  }[$level],
                  blocking_axis: (
                    if contra($s) then "contradiction"
                    elif $level == "gold" then null
                    elif $level == "silver" then
                      (if $s.autonomy != "agents_pick" then "autonomy" else "throughput" end)
                    elif $level == "copper" then
                      (if ($rh == null or $rh < 4) then "harness" else "intervention" end)
                    elif $level == "green" then "parallele"
                    elif $level == "blue" then
                      (if ($rt == null or $rt < 3) then "taille"
                       elif ($rh == null or $rh < 3) then "harness"
                       else "intervention" end)
                    elif $level == "red" then
                      (if ($rt == null or $rt < 2) then "taille"
                       elif ($rh == null or $rh < 2) then "harness"
                       else "intervention" end)
                    elif ($rt == null or $rt < 1) then "taille"
                    elif ($rh == null or $rh < 1) then "harness"
                    elif ($ri == null or $ri < 1) then "intervention"
                    elif ($rp == null or $rp < 1) then "parallele"
                    else "all"
                    end
                  ),
                  confidence: (if (contra($s) or $unk >= 2) then "low" elif $unk == 1 then "medium" else "high" end),
                  contradiction: contra($s),
                  unknown_count: $unk,
                  axes: {
                    taille: ($rt // 0),
                    harness: ($rh // 0),
                    intervention: ($ri // 0),
                    parallele: ($rp // 0)
                  },
                  gap: (
                    if contra($s) then "trancher les faits incompatibles avant de noter"
                    elif $level == "gold" then "deja Gold"
                    elif $level == "silver" then "laisser les agents prendre les tickets et merger plusieurs PR par jour sans commit humain"
                    elif $level == "copper" then "installer une boucle qui relance l'IA tant que la CI est rouge, et ne plus toucher au diff"
                    elif $level == "green" then "mener 3 chantiers le meme jour jusqu'a la PR"
                    elif $level == "blue" then "versionner rules + agents, n'intervenir qu'aux etapes cles, viser une PR taille L"
                    elif $level == "red" then "poser une memoire projet et relire seulement une partie du diff"
                    else "livrer une PR taille S assistee, garder le prompt, un seul chantier"
                    end
                  ),
                  signals: $s
                };
            [range(0; ($pairs | length))]
            | map(
                . as $i
                | $pairs[$i] as $p
                | correct(norm($ex[$i]); $p.text) as $s
                | score($s) as $sc
                | $sc + {
                    extract_ok: ($s.fallback != true),
                    fallback: ($s.fallback == true),
                    path: $p.path,
                    stem: $p.stem,
                    snapshot: {
                      t: $t,
                      evidence: [
                        {
                          key: "unknown_count",
                          value: ([($sc.unknown_count * 2000), 10000] | min),
                          source: "scorer",
                          observed_at: $t,
                          digest: ("u-" + $p.stem),
                          confidentiality: "internal",
                          integrity: "verified",
                          quality: {
                            freshness: "fresh",
                            completeness: (if $sc.unknown_count == 0 then "complete" else "paginated_partial" end),
                            independence_group: "scorer"
                          }
                        },
                        {
                          key: "contradiction",
                          value: $sc.contradiction,
                          source: "scorer",
                          observed_at: $t,
                          digest: ("c-" + $p.stem),
                          confidentiality: "internal",
                          integrity: "verified",
                          quality: {
                            freshness: "fresh",
                            completeness: "complete",
                            independence_group: "scorer"
                          }
                        }
                      ]
                    }
                  }
              )

  decided:
    with:
      items: ${{ tasks.scored.output }}
      snapshot: ${{ item.snapshot }}
    for_each:
      items: ${{ with.items }}
      max_parallel: 8
      fail_fast: false
    on_error:
      recover: null
    invoke:
      tool: "nika:decide"
      args:
        bundle: "${{ const.bundle }}"
        evidence: "${{ with.snapshot }}"

  explain:
    with:
      items: ${{ tasks.scored.output }}
      model: ${{ inputs.model }}
    timeout: "90s"
    for_each:
      items: ${{ with.items }}
      max_parallel: 2
      fail_fast: false
    on_error:
      recover: null
    retry:
      max_attempts: 2
      backoff_strategy: exponential
      jitter: true
    infer:
      model: "${{ inputs.model }}"
      max_tokens: 2500
      prompt: |
        Expliquer un verdict AIDD. Le niveau est ${{ item.level }}.
        Interdiction de le changer. Cite les preuves. Une page courte, en francais.

        Axe qui bloque le cran suivant: ${{ item.blocking_axis }}
        Prochain cran: ${{ item.next }}
        Geste impose (ne pas en inventer un autre): ${{ item.gap }}
        Confiance: ${{ item.confidence }}
        Contradiction detectee: ${{ item.contradiction }}
        Signaux: ${{ item.signals }}

        Ecris why (2-4 phrases) et next_move (1 phrase, le geste impose).
      schema:
        type: object
        additionalProperties: false
        required: [why, next_move]
        properties:
          why: { type: string }
          next_move: { type: string }

  cards:
    with:
      scored: ${{ tasks.scored.output }}
      decided: ${{ tasks.decided.output }}
      stories: ${{ tasks.explain.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.scored }}", "${{ with.decided }}", "${{ with.stories }}"]
        expression: >-
          .[0] as $s | .[1] as $d | .[2] as $t
          | [range(0; ($s | length))]
          | map(
              . as $i
              | $s[$i] as $row
              | (($d[$i] // {outcome: "defer"}).outcome // "defer") as $out
              | (($t[$i] // {why: "profil illisible", next_move: $row.gap})) as $story
              | ($row.level | ascii_upcase) as $L
              | {
                  stem: $row.stem,
                  path: $row.path,
                  extract_ok: ($row.extract_ok != false),
                  fallback: ($row.fallback == true),
                  axes: ($row.axes // {}),
                  level: $row.level,
                  rank: $row.rank,
                  next: $row.next,
                  blocking_axis: $row.blocking_axis,
                  confidence: $row.confidence,
                  contradiction: $row.contradiction,
                  publish: $out,
                  why: $story.why,
                  next_move: $story.next_move,
                  out_path: ("./out/verdicts/" + $row.stem + ".md"),
                  markdown: (
                    "# " + $L
                    + " · confiance " + $row.confidence
                    + " · publication " + $out + "\n\n"
                    + $story.why + "\n\n"
                    + "## Axe bloquant\n\n"
                    + (($row.blocking_axis // "aucun") | tostring) + "\n\n"
                    + "## Prochain cran\n\n"
                    + $story.next_move + "\n"
                  )
                }
            )

  write_each:
    with:
      cards: ${{ tasks.cards.output }}
      path: ${{ item.out_path }}
      body: ${{ item.markdown }}
    for_each:
      items: ${{ with.cards }}
      max_parallel: 8
      fail_fast: false
    on_error:
      recover: null
    invoke:
      tool: "nika:write"
      args:
        path: "${{ with.path }}"
        content: "${{ with.body }}"
        create_dirs: true

  chart:
    with:
      cards: ${{ tasks.cards.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.cards }}"
        expression: "map({ profile: .stem, rank: .rank })"

  picture:
    with:
      rows: ${{ tasks.chart.output }}
    invoke:
      tool: "nika:chart"
      args:
        data: "${{ with.rows }}"
        semantics: { profile: category, rank: count }
        chart: { type: bar, x: profile, y: rank, title: "Niveaux AIDD (0 White · 6 Gold)" }
        out: "./out/team.svg"

  roster:
    with:
      cards: ${{ tasks.cards.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.cards }}"
        expression: >-
          (map("- **" + .stem + "** · " + .level
               + " · " + .confidence
               + " · publish " + .publish
               + (if .fallback == true then " · fallback" else "" end)
               + (if .extract_ok == false then " · extract miss" else "" end)
          ) | join("\n")) as $rows
          | "# Equipe\n\n"
            + "La loi: un niveau n'est atteint que si tous ses axes le sont.\n"
            + "Le modele n'ecrit pas le niveau. jq le calcule. nika:decide dit si on publie.\n\n"
            + $rows + "\n"

  write_team:
    with:
      body: ${{ tasks.roster.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/team.md"
        content: "${{ with.body }}"
        create_dirs: true

  roster_json:
    with:
      cards: ${{ tasks.cards.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.cards }}"
        expression: >-
          map({
            stem, extract_ok, fallback, level, rank, next, blocking_axis,
            confidence, contradiction, publish, why, next_move, axes
          })

  write_json:
    with:
      body: ${{ tasks.roster_json.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/team.json"
        content: "${{ with.body }}"
        create_dirs: true

  as_yaml:
    with:
      body: ${{ tasks.roster_json.output }}
    invoke:
      tool: "nika:convert"
      args:
        input: "${{ with.body }}"
        from: json
        to: yaml

  write_yaml:
    with:
      body: ${{ tasks.as_yaml.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/team.yaml"
        content: "${{ with.body }}"
        create_dirs: true

  digest_text:
    with:
      body: ${{ tasks.roster_json.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.body }}"
        expression: "tojson"

  digest:
    with:
      text: ${{ tasks.digest_text.output }}
    invoke:
      tool: "nika:hash"
      args:
        content: "${{ with.text }}"
        algo: blake3

  schema_file:
    invoke:
      tool: "nika:read"
      args:
        path: "${{ const.team_schema }}"

  schema_obj:
    with:
      raw: ${{ tasks.schema_file.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.raw }}"
        expression: "if type == \"string\" then fromjson else . end"

  certify_shape:
    with:
      body: ${{ tasks.roster_json.output }}
      schema: ${{ tasks.schema_obj.output }}
    invoke:
      tool: "nika:validate"
      args:
        data: "${{ with.body }}"
        schema: "${{ with.schema }}"

  certify:
    with:
      report: ${{ tasks.certify_shape.output }}
    invoke:
      tool: "nika:assert"
      args:
        condition: ${{ with.report.valid }}
        message: "team.json failed nika:validate"

  heat_rows:
    with:
      cards: ${{ tasks.cards.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.cards }}"
        expression: >-
          map(. as $c
              | ($c.axes // {}) as $a
              | [
                  { profile: $c.stem, axis: "taille", rank: ($a.taille // 0) },
                  { profile: $c.stem, axis: "harness", rank: ($a.harness // 0) },
                  { profile: $c.stem, axis: "intervention", rank: ($a.intervention // 0) },
                  { profile: $c.stem, axis: "parallele", rank: ($a.parallele // 0) }
                ])
          | add

  heat:
    with:
      rows: ${{ tasks.heat_rows.output }}
    invoke:
      tool: "nika:chart"
      args:
        data: "${{ with.rows }}"
        semantics: { profile: category, axis: category, rank: count }
        chart:
          type: heatmap
          x: profile
          y: axis
          color: rank
          title: "Axes AIDD (0 none · 4 max)"
        out: "./out/axes.svg"

  belt_rows:
    with:
      cards: ${{ tasks.cards.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: "${{ with.cards }}"
        expression: >-
          group_by(.level)
          | map({ level: .[0].level, n: length, rank: (.[0].rank) })
          | sort_by(.rank)

  belts:
    with:
      rows: ${{ tasks.belt_rows.output }}
    invoke:
      tool: "nika:chart"
      args:
        data: "${{ with.rows }}"
        semantics: { level: category, n: count }
        chart: { type: bar, x: level, y: n, title: "Effectif par ceinture" }
        out: "./out/belts.svg"

  stamp:
    with:
      cards: ${{ tasks.cards.output }}
      stats: ${{ tasks.extract_stats.output }}
      digest: ${{ tasks.digest.output }}
      id: ${{ tasks.run_id.output }}
      t: ${{ tasks.now.output }}
      valid: ${{ tasks.certify_shape.output }}
    invoke:
      tool: "nika:jq"
      args:
        input:
          - "${{ with.cards }}"
          - "${{ with.stats }}"
          - "${{ with.digest }}"
          - "${{ with.id }}"
          - "${{ with.t }}"
          - "${{ with.valid }}"
        expression: >-
          .[0] as $c
          | {
              run_id: .[3],
              observed_at: .[4],
              digest_blake3: .[2],
              extract: .[1],
              valid: (.[5].valid // false),
              n: ($c | length),
              recommended: ([$c[] | select(.publish == "recommend")] | length),
              deferred: ([$c[] | select(.publish != "recommend")] | length),
              fallbacks: ([$c[] | select(.fallback == true)] | length),
              law: "all-axes-or-nothing",
              engine: "nika",
              model_writes_level: false
            }

  write_receipt:
    with:
      body: ${{ tasks.stamp.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/receipt.json"
        content: "${{ with.body }}"
        create_dirs: true

  emit_roster:
    with:
      receipt: ${{ tasks.stamp.output }}
    invoke:
      tool: "nika:emit"
      args:
        event_type: "laivel.roster"
        payload: "${{ with.receipt }}"

  jury:
    with:
      cards: ${{ tasks.cards.output }}
      receipt: ${{ tasks.stamp.output }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.cards }}", "${{ with.receipt }}"]
        expression: >-
          .[0] as $c | .[1] as $r
          | ($c | map("- **" + .stem + "** · " + (.level | ascii_upcase)
                 + " · " + .publish
                 + " · bloque " + ((.blocking_axis // "rien") | tostring)
            ) | join("\n")) as $rows
          | "# Laivel · une page pour le jury\n\n"
            + "Un workflow Nika. Zero script. Le modele extrait des faits. "
            + "**jq** applique la loi *tous les axes ou rien*. "
            + "**nika:decide** publie ou s'abstient. "
            + "Le modele n'ecrit jamais le niveau.\n\n"
            + "- run `" + ($r.run_id | tostring) + "`\n"
            + "- " + ($r.observed_at | tostring) + "\n"
            + "- blake3 `" + ($r.digest_blake3 | tostring) + "`\n"
            + "- " + ($r.n | tostring) + " profils · "
            + ($r.recommended | tostring) + " publies · "
            + ($r.deferred | tostring) + " deferres\n"
            + "- extract: " + ($r.extract | tostring) + "\n\n"
            + "## Equipe\n\n" + $rows + "\n\n"
            + "## Pourquoi pas 0-100\n\n"
            + "Un harness Gold avec des PR taille S est Red. "
            + "La moyenne ment. Le min de la grille dit la verite.\n\n"
            + "Relancer: `nika run laivel.nika.yaml --max-cost-usd 3`\n"

  write_jury:
    with:
      body: ${{ tasks.jury.output }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/JURY.md"
        content: "${{ with.body }}"
        create_dirs: true

  expected:
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:read"
      args:
        path: "${{ inputs.expected }}"
    lift:
      - law: taint
        from: inputs.expected
        because: "operator path to a committed expected map, still inside permits.fs.read"

  compare:
    with:
      cards: ${{ tasks.cards.output }}
      expected: ${{ tasks.expected.output }}
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.cards }}", "${{ with.expected }}"]
        expression: >-
          .[0] as $cards
          | (.[1] | if type == "string" then fromjson else . end) as $exp
          | ($cards | map(select($exp[.stem] != null and $exp[.stem] != .level))) as $bad
          | {
              ok: ($bad | length == 0),
              message: (
                if ($bad | length == 0) then "self-test green"
                else ("mismatch " + ($bad | map(.stem + "=" + .level + " want " + $exp[.stem]) | join(", ")))
                end
              )
            }

  maps:
    with:
      cards: ${{ tasks.cards.output }}
      expected: ${{ tasks.expected.output }}
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:jq"
      args:
        input: ["${{ with.cards }}", "${{ with.expected }}"]
        expression: >-
          .[0] as $cards
          | (.[1] | if type == "string" then fromjson else . end) as $exp
          | {
              got: ($cards | map({ key: .stem, value: .level }) | from_entries),
              exp: $exp
            }

  delta:
    with:
      maps: ${{ tasks.maps.output }}
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:json_diff"
      args:
        before: "${{ with.maps.exp }}"
        after: "${{ with.maps.got }}"

  write_delta:
    with:
      body: ${{ tasks.delta.output }}
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:write"
      args:
        path: "./out/self-test.patch.json"
        content: "${{ with.body }}"
        create_dirs: true

  selfcheck:
    with:
      ok: ${{ tasks.compare.output.ok }}
      message: ${{ tasks.compare.output.message }}
    when: ${{ inputs.self_test == true }}
    invoke:
      tool: "nika:assert"
      args:
        condition: ${{ with.ok }}
        message: "${{ with.message }}"

outputs:
  cards:
    value: ${{ tasks.cards.output }}
    description: "Per-profile verdicts · level from jq, publish from nika:decide"
  team:
    value: ${{ tasks.roster.output }}
  receipt:
    value: ${{ tasks.stamp.output }}
    description: "blake3 receipt · run id · publish counts"
  jury:
    value: ${{ tasks.jury.output }}
    description: "One-page jury brief"
