# Machine encoding of the official AIDD grid.
# Source: https://github.com/ai-driven-dev/laivel-up/blob/main/levels/aidd.md
# Law: a level is reached only if ALL of its axes are reached.
# Levels accumulate. Unknown on an axis refuses every level that needs it.

law: all-axes-or-nothing

axes:
  - id: taille
    values: [none, S, M, L, XL]
  - id: harness
    values: [none, prompts, context, context_behavior, context_behavior_loops]
  - id: intervention
    values: [none, after_majority, after_part, key_steps, never]
  - id: parallele
    values: ["0", "1", "3"]
  - id: autonomy
    values: [no, human_starts, agents_pick]
    notes: "Gold only. Agents take tasks without a human starting each one."
  - id: throughput
    values: [none, one, multi_pr_day]
    notes: "Gold only. Several PRs per day with no human commit."

levels:
  - id: white
    rank: 0
    label: "White"
    require:
      taille: none
      harness: none
      intervention: none
      parallele: "0"
  - id: red
    rank: 1
    label: "Red"
    require:
      taille: S
      harness: prompts
      intervention: after_majority
      parallele: "1"
  - id: blue
    rank: 2
    label: "Blue"
    require:
      taille: M
      harness: context
      intervention: after_part
      parallele: "1"
  - id: green
    rank: 3
    label: "Green"
    require:
      taille: L
      harness: context_behavior
      intervention: key_steps
      parallele: "1"
  - id: copper
    rank: 4
    label: "Copper"
    require:
      taille: L
      harness: context_behavior
      intervention: key_steps
      parallele: "3"
  - id: silver
    rank: 5
    label: "Silver"
    require:
      taille: L
      harness: context_behavior_loops
      intervention: never
      parallele: "3"
  - id: gold
    rank: 6
    label: "Gold"
    require:
      taille: L
      harness: context_behavior_loops
      intervention: never
      parallele: "3"
      autonomy: agents_pick
      throughput: multi_pr_day

# Minimum rank per axis to claim a level. "unknown" never satisfies a minimum.
floor:
  none: 0
  S: 1
  M: 2
  L: 3
  XL: 3
  prompts: 1
  context: 2
  context_behavior: 3
  context_behavior_loops: 4
  after_majority: 1
  after_part: 2
  key_steps: 3
  never: 4
  "0": 0
  "1": 1
  "3": 2
